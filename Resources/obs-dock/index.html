<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoundMeeter</title>
<link rel="stylesheet" href="dock.css">
</head>
<body>
<div class="dock">
    <div class="head">
        <span class="dot" id="dot" title="Connection"></span>
        <span class="title">SoundMeeter</span>
        <span class="engine" id="engine" hidden>engine stopped</span>

    <div class="channels" id="channels"></div>
    <div class="empty" id="empty">No channels selected.<br>Choose them in SoundMeeter → OBS dock.</div>
</div>
<script src="dock.js"></script>
</body>
</html>
